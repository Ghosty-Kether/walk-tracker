<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Walk Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4285F4;
      --blue-dark: #1a73e8;
      --red: #EA4335;
      --green: #34A853;
      --yellow: #FBBC04;
      --surface: #fff;
      --surface-2: #f8f9fa;
      --text: #202124;
      --text-2: #5f6368;
      --shadow-1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
      --shadow-2: 0 3px 6px rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.12);
      --shadow-3: 0 10px 20px rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.10);
      --radius: 12px;
    }

    html, body { height: 100%; font-family: 'Roboto', system-ui, sans-serif; overflow: hidden; background: #e8eaed; }

    /* ── Map ── */
    #map { position: fixed; inset: 0; z-index: 0; }
    .leaflet-control-zoom { display: none; }

    /* ── Floating action bar ── */
    #fab-area {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 0);
      pointer-events: none;
    }

    /* bottom sheet */
    #bottom-sheet {
      width: 100%; max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: var(--shadow-3);
      padding: 8px 20px 24px;
      pointer-events: all;
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: #dadce0; border-radius: 2px;
      margin: 0 auto 14px;
    }

    /* walk status label */
    #walk-label {
      font-size: 12px; font-weight: 500; letter-spacing: .8px;
      text-transform: uppercase; color: var(--text-2);
      text-align: center; margin-bottom: 10px;
    }

    /* stats grid */
    #stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 18px;
    }
    .stat-card {
      background: var(--surface-2); border-radius: 10px;
      padding: 10px 14px;
    }
    .stat-label {
      font-size: 11px; font-weight: 500; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px;
    }
    .stat-value {
      font-size: 22px; font-weight: 700; color: var(--text);
      line-height: 1.2;
    }
    .stat-unit { font-size: 13px; font-weight: 400; color: var(--text-2); margin-left: 2px; }

    /* buttons row */
    #btn-row {
      display: flex; gap: 12px; align-items: center; justify-content: center;
    }

    .btn {
      border: none; cursor: pointer; font-family: inherit;
      font-size: 15px; font-weight: 500; letter-spacing: .25px;
      border-radius: 50px; padding: 14px 28px;
      transition: box-shadow .2s, transform .1s, background .2s;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary {
      background: var(--blue); color: #fff;
      box-shadow: 0 2px 8px rgba(66,133,244,.4);
      flex: 1; justify-content: center;
    }
    .btn-primary:hover { background: var(--blue-dark); box-shadow: 0 4px 12px rgba(66,133,244,.5); }
    .btn-secondary {
      background: var(--surface-2); color: var(--text);
      border: 1px solid #dadce0;
    }
    .btn-secondary:hover { background: #e8eaed; }
    .btn-danger {
      background: #fce8e6; color: var(--red);
      border: 1px solid #f28b82;
    }
    .btn-danger:hover { background: #f9d0cd; }
    .btn-pause {
      background: #e8f0fe; color: var(--blue);
      border: 1px solid #aecbfa;
    }
    .btn-pause:hover { background: #d2e3fc; }

    /* ── Floating corner buttons ── */
    .fab-corner {
      position: fixed; z-index: 10;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--surface); box-shadow: var(--shadow-2);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .2s, transform .1s;
    }
    .fab-corner:active { transform: scale(.92); }
    .fab-corner:hover { box-shadow: var(--shadow-3); }

    #btn-recenter { bottom: 230px; right: 16px; }
    #btn-history  { top: 16px; right: 16px; }

    .fab-corner svg { width: 22px; height: 22px; fill: var(--text-2); }
    #btn-recenter.centered svg { fill: var(--blue); }

    /* ── Toast ── */
    #toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 18px;
      border-radius: 8px; font-size: 14px;
      box-shadow: var(--shadow-2); z-index: 100;
      opacity: 0; transition: opacity .25s; pointer-events: none;
      white-space: nowrap; max-width: 90vw;
    }
    #toast.show { opacity: 1; }

    /* ── History Panel ── */
    #history-panel {
      position: fixed; inset: 0; z-index: 20;
      background: var(--surface);
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
    }
    #history-panel.open { transform: translateX(0); }

    .panel-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid #e8eaed;
      background: var(--surface);
    }
    .panel-header h2 { font-size: 18px; font-weight: 500; flex: 1; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 22px; height: 22px; fill: var(--text-2); }

    #history-list {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }
    .history-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; cursor: pointer;
      transition: background .15s;
    }
    .history-item:hover { background: var(--surface-2); }
    .history-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: #e8f0fe; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .history-icon svg { width: 22px; height: 22px; fill: var(--blue); }
    .history-info { flex: 1; }
    .history-title { font-size: 15px; font-weight: 500; color: var(--text); }
    .history-meta  { font-size: 13px; color: var(--text-2); margin-top: 2px; }
    .history-dist  { font-size: 15px; font-weight: 700; color: var(--text); }

    .history-empty {
      text-align: center; color: var(--text-2); padding: 60px 24px;
    }
    .history-empty svg { width: 56px; height: 56px; fill: #dadce0; margin-bottom: 12px; }
    .history-empty p { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .history-empty span { font-size: 14px; }

    /* ── Route detail overlay ── */
    #route-detail {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
      display: none;
    }
    #route-detail.show { display: block; }
    #route-detail-card {
      background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: var(--shadow-3); padding: 8px 20px 28px;
      max-width: 480px; margin: 0 auto;
    }
    #route-detail-title { font-size: 16px; font-weight: 500; text-align: center; margin-bottom: 12px; }
    #route-detail-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-bottom: 16px;
    }
    #route-detail-stats .stat-card { padding: 8px 10px; }
    #route-detail-stats .stat-value { font-size: 18px; }

    /* ── Accuracy indicator ── */
    #accuracy-badge {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: var(--surface); border-radius: 20px;
      padding: 6px 12px; box-shadow: var(--shadow-1);
      font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px;
      display: none;
    }
    #accuracy-badge.show { display: flex; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-green  { background: var(--green); }
    .dot-yellow { background: var(--yellow); }
    .dot-red    { background: var(--red); }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Accuracy badge -->
<div id="accuracy-badge">
  <span class="dot dot-green" id="acc-dot"></span>
  <span id="acc-text">GPS: good</span>
</div>

<!-- Corner buttons -->
<button class="fab-corner" id="btn-recenter" title="Re-center" onclick="recenter()">
  <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
</button>
<button class="fab-corner" id="btn-history" title="Walk history" onclick="openHistory()">
  <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
</button>

<!-- Bottom sheet -->
<div id="fab-area">
  <div id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div id="walk-label">Ready to walk</div>

    <div id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Distance</div>
        <div class="stat-value" id="stat-dist">0.00<span class="stat-unit">km</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Duration</div>
        <div class="stat-value" id="stat-time">00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Speed</div>
        <div class="stat-value" id="stat-speed">0.0<span class="stat-unit">km/h</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Speed</div>
        <div class="stat-value" id="stat-avg">0.0<span class="stat-unit">km/h</span></div>
      </div>
    </div>

    <div id="btn-row">
      <button class="btn btn-primary" id="btn-start" onclick="startWalk()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        Start Walk
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- History panel -->
<div id="history-panel">
  <div class="panel-header">
    <button class="icon-btn" onclick="closeHistory()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <h2>Walk History</h2>
    <button class="icon-btn" id="btn-clear-all" onclick="clearAllWalks()" title="Clear all">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>
  <div id="history-list"></div>
</div>

<!-- Route detail overlay -->
<div id="route-detail">
  <div id="route-detail-card">
    <div class="sheet-handle"></div>
    <div id="route-detail-title">Walk</div>
    <div id="route-detail-stats">
      <div class="stat-card">
        <div class="stat-label">Distance</div>
        <div class="stat-value" id="rd-dist">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Duration</div>
        <div class="stat-value" id="rd-time">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Speed</div>
        <div class="stat-value" id="rd-avg">—</div>
      </div>
    </div>
    <div id="btn-row-detail" style="display:flex;gap:12px;">
      <button class="btn btn-secondary" style="flex:1;justify-content:center;" onclick="closeRouteDetail()">Close</button>
      <button class="btn btn-danger" style="flex:1;justify-content:center;" id="btn-delete-walk">Delete</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─────────────────────────── State ───────────────────────────
const state = {
  status: 'idle',   // idle | active | paused
  watchId: null,
  coords: [],       // [{lat, lng, ts, gap?}]  gap = first point after a pause
  liveSegments: [], // route being drawn, as [[lat, lng], …] per segment
  newSegment: false,// next accepted point starts a new segment (after resume)
  lastSpeedTs: 0,   // when the speed readout was last refreshed
  startTs: null,
  pausedMs: 0,
  pauseStart: null,
  totalDist: 0,
  lastPos: null,
  timerInterval: null,
  centered: false,
  currentViewWalkId: null,
};

// ─────────────────────────── Map ───────────────────────────
const map = L.map('map', { zoomControl: false, attributionControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

// Default view — will recenter on GPS fix
map.setView([51.505, -0.09], 15);

let routeLine = null;        // active walk polyline
let reviewLine = null;       // history review polyline
let userMarker = null;       // live position marker

function ensureRouteLine() {
  if (!routeLine) {
    routeLine = L.polyline([], { color: '#4285F4', weight: 5, opacity: .85, lineJoin: 'round' }).addTo(map);
  }
}

function clearRouteLine() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  state.liveSegments = [];
}

function clearReviewLine() {
  if (reviewLine) { map.removeLayer(reviewLine); reviewLine = null; }
}

function updateUserMarker(lat, lng) {
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:#4285F4;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8],
  });
  if (!userMarker) {
    userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
  } else {
    userMarker.setLatLng([lat, lng]).setIcon(icon);
  }
}

// ─────────────────────────── Geolocation ───────────────────────────
const GEO_OPTIONS = { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 };
const MAX_ACCURACY_M = 50;   // ignore fixes less accurate than this for route and distance
const MIN_STEP_M = 2;        // ignore movement smaller than this (GPS jitter)

function onPosition(pos) {
  const { latitude: lat, longitude: lng, accuracy, speed } = pos.coords;
  updateUserMarker(lat, lng);
  updateAccuracyBadge(accuracy);

  // Always move map if centered flag is set
  if (state.centered) {
    map.panTo([lat, lng], { animate: true, duration: 0.5 });
  }

  if (state.status !== 'active') return;

  // Weak fix: keep showing the marker, but don't let it distort the route or distance
  if (accuracy > MAX_ACCURACY_M) return;

  const now = Date.now();
  const hasDeviceSpeed = speed != null && !Number.isNaN(speed);

  // Prefer the device-reported speed (m/s → km/h)
  if (hasDeviceSpeed) {
    setSpeed(speed * 3.6);
    state.lastSpeedTs = now;
  }

  let stepKph = null;
  if (state.lastPos) {
    const d = haversine(state.lastPos.lat, state.lastPos.lng, lat, lng);
    if (d < MIN_STEP_M) return; // jitter, not recorded
    state.totalDist += d;
    const dt = (now - state.lastPos.ts) / 1000;
    if (dt > 0) stepKph = (d / dt) * 3.6;
  } else if (state.coords.length === 0) {
    // first point of a new walk
    map.setView([lat, lng], 17, { animate: true });
    state.centered = true;
  }

  // Fallback speed when the device doesn't report one
  if (stepKph !== null && !hasDeviceSpeed) {
    setSpeed(stepKph);
    state.lastSpeedTs = now;
  }

  const point = { lat, lng, ts: now };
  // First point after a pause: start a new segment so no line is drawn across the gap
  if (state.newSegment && state.coords.length) point.gap = true;
  state.newSegment = false;

  state.lastPos = { lat, lng, ts: now };
  state.coords.push(point);
  addRoutePoint(point);
  schedulePersist();
}

let lastGeoToast = 0;
function onGeoError(err) {
  if (err.code === 1) {
    // Permission denied: tracking can't continue
    if (state.status !== 'idle') stopWalk();
    showToast('Location permission denied. Please allow location access and try again.', 4000);
    return;
  }
  // Signal lost / timeout are usually temporary and the watch keeps retrying,
  // so keep the walk going instead of ending it.
  const now = Date.now();
  if (now - lastGeoToast > 8000) {
    lastGeoToast = now;
    showToast(err.code === 2 ? 'GPS signal lost — still trying…' : 'Waiting for GPS…', 3000);
  }
}

function updateAccuracyBadge(acc) {
  const badge = el('accuracy-badge');
  const dot = el('acc-dot');
  const txt = el('acc-text');
  badge.classList.add('show');
  if (acc <= 15)       { dot.className = 'dot dot-green';  txt.textContent = `GPS ±${Math.round(acc)}m`; }
  else if (acc <= 50)  { dot.className = 'dot dot-yellow'; txt.textContent = `GPS ±${Math.round(acc)}m`; }
  else                 { dot.className = 'dot dot-red';    txt.textContent = `GPS poor ±${Math.round(acc)}m`; }
}

// ─────────────────────────── Walk controls ───────────────────────────
function startWalk() {
  if (!navigator.geolocation) {
    showToast('Geolocation not supported by your browser.'); return;
  }

  // Reset state
  state.coords = [];
  state.totalDist = 0;
  state.lastPos = null;
  state.newSegment = false;
  state.startTs = Date.now();
  state.lastSpeedTs = state.startTs;
  state.pausedMs = 0;
  state.pauseStart = null;
  state.status = 'active';
  state.centered = false;
  clearRouteLine();
  clearReviewLine();
  setSpeed(0);

  state.watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, GEO_OPTIONS);

  startTimer();
  updateStats();
  renderButtons();
  requestWakeLock();
  el('walk-label').textContent = 'Walk in progress';
  showToast('Walk started — acquiring GPS…');
}

function pauseWalk() {
  if (state.status !== 'active') return;
  state.status = 'paused';
  state.pauseStart = Date.now();
  if (state.watchId !== null) { navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
  clearInterval(state.timerInterval); state.timerInterval = null;
  updateStats();
  setSpeed(0);
  releaseWakeLock();
  persistProgress();
  renderButtons();
  el('walk-label').textContent = 'Walk paused';
  showToast('Walk paused');
}

function resumeWalk() {
  if (state.status !== 'paused') return;
  state.pausedMs += Date.now() - state.pauseStart;
  state.pauseStart = null;
  state.status = 'active';
  // Don't count distance travelled while paused: the next fix starts a new segment
  state.lastPos = null;
  state.newSegment = true;
  state.lastSpeedTs = Date.now();
  state.watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, GEO_OPTIONS);
  startTimer();
  requestWakeLock();
  persistProgress();
  renderButtons();
  el('walk-label').textContent = 'Walk in progress';
  showToast('Walk resumed');
}

function stopWalk() {
  if (state.status === 'idle') return;
  if (state.watchId !== null) { navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
  clearInterval(state.timerInterval); state.timerInterval = null;

  const elapsed = elapsedMs();
  const dist = state.totalDist;
  const worthSaving = state.coords.length >= 2 && dist > 0;
  if (worthSaving) {
    saveWalk({
      id: Date.now(),
      date: new Date().toISOString(),
      coords: state.coords,
      distM: dist,
      durationMs: elapsed,
    });
  }

  clearProgress();
  releaseWakeLock();
  updateStats();
  setSpeed(0);

  state.status = 'idle';
  state.centered = false;
  state.lastPos = null;
  state.startTs = null;
  state.pauseStart = null;
  renderButtons();
  el('walk-label').textContent = worthSaving ? 'Walk saved!' : 'Walk discarded';
  el('accuracy-badge').classList.remove('show');
  showToast(worthSaving
    ? `Walk saved — ${fmtDist(dist)} km in ${fmtDuration(elapsed)}`
    : 'Walk too short to save');

  // reset stats (unless a new walk has already started)
  setTimeout(() => {
    if (state.status !== 'idle') return;
    state.totalDist = 0;
    el('walk-label').textContent = 'Ready to walk';
    updateStats();
    setSpeed(0);
  }, 3000);
}

function elapsedMs() {
  if (!state.startTs) return 0;
  const extra = state.pauseStart ? (Date.now() - state.pauseStart) : 0;
  return Date.now() - state.startTs - state.pausedMs - extra;
}

function updateStats() {
  const ms = elapsedMs();
  el('stat-time').textContent = fmtDuration(ms);
  el('stat-dist').innerHTML = `${fmtDist(state.totalDist)}<span class="stat-unit">km</span>`;
  const avgKph = ms > 0 ? ((state.totalDist / 1000) / (ms / 3600000)) : 0;
  el('stat-avg').innerHTML = `${avgKph.toFixed(1)}<span class="stat-unit">km/h</span>`;
}

function setSpeed(kph) {
  el('stat-speed').innerHTML = `${kph.toFixed(1)}<span class="stat-unit">km/h</span>`;
}

function startTimer() {
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    updateStats();
    // No fresh speed reading for a while (e.g. standing still): show 0
    if (Date.now() - state.lastSpeedTs > 10000) setSpeed(0);
  }, 1000);
}

// ─────────────────────────── Route drawing ───────────────────────────
// A walk's coords are drawn as separate segments, split wherever a point is
// flagged `gap` (the first point after a pause), so pauses don't draw a line.
function addRoutePoint(p) {
  ensureRouteLine();
  if (p.gap || !state.liveSegments.length) state.liveSegments.push([]);
  state.liveSegments[state.liveSegments.length - 1].push([p.lat, p.lng]);
  routeLine.setLatLngs(state.liveSegments);
}

function segmentsFromCoords(coords) {
  const segs = [];
  for (const c of coords) {
    if (c.gap || !segs.length) segs.push([]);
    segs[segs.length - 1].push([c.lat, c.lng]);
  }
  return segs;
}

// ─────────────────────────── In-progress walk backup ───────────────────────────
// The active walk is saved to localStorage as it goes, so a reload, crash or
// killed tab doesn't lose it. On next load it comes back paused.
const PROGRESS_KEY = 'walkInProgress';
let persistTimer = null;

function persistProgress() {
  clearTimeout(persistTimer); persistTimer = null;
  if (state.status === 'idle') return;
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      status: state.status,
      startTs: state.startTs,
      pausedMs: state.pausedMs,
      pauseStart: state.pauseStart,
      totalDist: state.totalDist,
      coords: state.coords,
      savedAt: Date.now(),
    }));
  } catch { /* storage full or unavailable: carry on without a backup */ }
}

function schedulePersist() {
  if (persistTimer) return;
  persistTimer = setTimeout(persistProgress, 5000);
}

function clearProgress() {
  clearTimeout(persistTimer); persistTimer = null;
  try { localStorage.removeItem(PROGRESS_KEY); } catch {}
}

function restoreInProgress() {
  let data;
  try { data = JSON.parse(localStorage.getItem(PROGRESS_KEY)); } catch { return; }
  if (!data || !data.startTs || !Array.isArray(data.coords) ||
      !data.coords.every(c => c && Number.isFinite(c.lat) && Number.isFinite(c.lng))) return;

  state.coords = data.coords;
  state.totalDist = data.totalDist || 0;
  state.startTs = data.startTs;
  state.pausedMs = data.pausedMs || 0;
  // Time between the last backup and now is not counted as walking time
  state.pauseStart = (data.status === 'paused' && data.pauseStart) ? data.pauseStart : (data.savedAt || Date.now());
  state.status = 'paused';
  state.lastPos = null;
  state.newSegment = true;

  state.liveSegments = segmentsFromCoords(state.coords);
  ensureRouteLine();
  routeLine.setLatLngs(state.liveSegments);

  updateStats();
  renderButtons();
  el('walk-label').textContent = 'Walk paused';
  showToast('Unfinished walk restored. Resume or Stop & Save.', 4000);
}

// ─────────────────────────── Keep screen awake ───────────────────────────
let wakeLock = null;
let wakeLockWanted = false;   // true while a walk is active
let wakeLockPending = false;  // a request is in flight

async function requestWakeLock() {
  wakeLockWanted = true;
  if (!('wakeLock' in navigator) || wakeLock || wakeLockPending) return;
  wakeLockPending = true;
  try {
    const lock = await navigator.wakeLock.request('screen');
    if (!wakeLockWanted) { lock.release().catch(() => {}); return; } // walk paused/stopped meanwhile
    wakeLock = lock;
    lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
  } catch { /* not allowed (e.g. page hidden or low battery) */ }
  finally { wakeLockPending = false; }
}

function releaseWakeLock() {
  wakeLockWanted = false;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistProgress();
  else if (state.status === 'active') requestWakeLock(); // the browser drops the lock when hidden
});
window.addEventListener('pagehide', persistProgress);

// ─────────────────────────── Buttons ───────────────────────────
function renderButtons() {
  const row = el('btn-row');
  if (state.status === 'idle') {
    row.innerHTML = `
      <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="startWalk()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        Start Walk
      </button>`;
  } else if (state.status === 'active') {
    row.innerHTML = `
      <button class="btn btn-pause" onclick="pauseWalk()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#4285F4"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Pause
      </button>
      <button class="btn btn-danger" style="flex:1;justify-content:center;" onclick="stopWalk()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#EA4335"><path d="M6 6h12v12H6z"/></svg>
        Stop &amp; Save
      </button>`;
  } else if (state.status === 'paused') {
    row.innerHTML = `
      <button class="btn btn-primary" onclick="resumeWalk()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        Resume
      </button>
      <button class="btn btn-danger" style="flex:1;justify-content:center;" onclick="stopWalk()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#EA4335"><path d="M6 6h12v12H6z"/></svg>
        Stop &amp; Save
      </button>`;
  }
}

// ─────────────────────────── Recenter ───────────────────────────
function recenter() {
  state.centered = true;
  el('btn-recenter').classList.add('centered');
  navigator.geolocation.getCurrentPosition(pos => {
    map.setView([pos.coords.latitude, pos.coords.longitude], 17, { animate: true });
  }, () => showToast('Could not get location'));
  setTimeout(() => el('btn-recenter').classList.remove('centered'), 2000);
}

map.on('dragstart', () => { state.centered = false; });

// ─────────────────────────── Persistence ───────────────────────────
function loadWalks() {
  try { return JSON.parse(localStorage.getItem('walkHistory') || '[]'); } catch { return []; }
}
function saveWalk(walk) {
  const walks = loadWalks();
  walks.unshift(walk);
  localStorage.setItem('walkHistory', JSON.stringify(walks));
}
function deleteWalk(id) {
  const walks = loadWalks().filter(w => w.id !== id);
  localStorage.setItem('walkHistory', JSON.stringify(walks));
}

// ─────────────────────────── History UI ───────────────────────────
function openHistory() {
  renderHistoryList();
  el('history-panel').classList.add('open');
}
function closeHistory() {
  el('history-panel').classList.remove('open');
}

function renderHistoryList() {
  const walks = loadWalks();
  const list = el('history-list');
  if (!walks.length) {
    list.innerHTML = `
      <div class="history-empty">
        <svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>
        <p>No walks yet</p>
        <span>Start your first walk to see it here</span>
      </div>`;
    return;
  }
  list.innerHTML = walks.map(w => `
    <div class="history-item" onclick="viewWalk(${w.id})">
      <div class="history-icon">
        <svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>
      </div>
      <div class="history-info">
        <div class="history-title">${fmtDate(w.date)}</div>
        <div class="history-meta">${fmtDuration(w.durationMs)} &nbsp;·&nbsp; avg ${fmtAvgSpeed(w.distM, w.durationMs)} km/h</div>
      </div>
      <div class="history-dist">${fmtDist(w.distM)} km</div>
    </div>`).join('');
}

function viewWalk(id) {
  const walks = loadWalks();
  const walk = walks.find(w => w.id === id);
  if (!walk) return;
  state.currentViewWalkId = id;
  closeHistory();

  clearReviewLine();
  if (walk.coords && walk.coords.length > 1) {
    const latlngs = segmentsFromCoords(walk.coords);
    reviewLine = L.polyline(latlngs, { color: '#EA4335', weight: 5, opacity: .85, lineJoin: 'round' }).addTo(map);
    map.fitBounds(reviewLine.getBounds(), { padding: [60, 60] });
  } else if (walk.coords && walk.coords.length === 1) {
    map.setView([walk.coords[0].lat, walk.coords[0].lng], 16);
  }

  el('route-detail-title').textContent = fmtDate(walk.date);
  el('rd-dist').innerHTML = `${fmtDist(walk.distM)}<span class="stat-unit" style="font-size:11px">km</span>`;
  el('rd-time').textContent = fmtDuration(walk.durationMs);
  el('rd-avg').innerHTML = `${fmtAvgSpeed(walk.distM, walk.durationMs)}<span class="stat-unit" style="font-size:11px">km/h</span>`;
  el('btn-delete-walk').onclick = () => { deleteWalk(id); closeRouteDetail(); showToast('Walk deleted'); };
  el('route-detail').classList.add('show');
}

function closeRouteDetail() {
  el('route-detail').classList.remove('show');
  clearReviewLine();
  state.currentViewWalkId = null;
}

function clearAllWalks() {
  if (!confirm('Delete all saved walks? This cannot be undone.')) return;
  localStorage.removeItem('walkHistory');
  renderHistoryList();
  showToast('All walks deleted');
}

// ─────────────────────────── Utils ───────────────────────────
function el(id) { return document.getElementById(id); }

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(m) { return (m / 1000).toFixed(2); }

function fmtDuration(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function fmtAvgSpeed(distM, durationMs) {
  if (!durationMs) return '0.0';
  return ((distM / 1000) / (durationMs / 3600000)).toFixed(1);
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

let toastTimer = null;
function showToast(msg, duration = 2500) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

// ─────────────────────────── Init ───────────────────────────
renderButtons();
restoreInProgress();

// Try to get initial position for map centering (no tracking)
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    map.setView([pos.coords.latitude, pos.coords.longitude], 15, { animate: false });
    updateUserMarker(pos.coords.latitude, pos.coords.longitude);
  }, () => {});
}
</script>
